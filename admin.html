<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>後台 — 檔期管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F3F1; --surface:#FFFFFF; --surface-alt:#E7E9E5;
    --ink:#20242A; --ink-soft:#5B6169;
    --accent:#3E7686; --accent-deep:#2A5866; --accent-tint:#DCE9EC;
    --booked:#3A3D42; --line:rgba(32,36,42,0.14); --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Noto Sans TC',sans-serif; line-height:1.6;
  }
  h1,h2{font-family:'M PLUS Rounded 1c','Noto Sans TC',sans-serif; font-weight:700; margin:0;}
  .wrap{max-width:760px; margin:0 auto; padding:40px 22px 80px;}

  /* login gate */
  #gate{
    max-width:360px; margin:120px auto; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); padding:32px; text-align:center;
  }
  #gate h1{font-size:1.2rem;}
  #gate p{color:var(--ink-soft); font-size:0.9rem; margin-top:8px;}
  #gate input{
    width:100%; margin-top:20px; padding:11px 12px; border:1px solid var(--line);
    border-radius:8px; font-size:1rem; text-align:center; letter-spacing:0.3em;
  }
  #gate button{
    margin-top:14px; width:100%; padding:12px; border:none; border-radius:24px;
    background:var(--accent); color:#fff; font-family:'M PLUS Rounded 1c',sans-serif;
    font-weight:700; font-size:0.96rem; cursor:pointer;
  }
  #gateError{color:#8A3B3B; font-size:0.85rem; margin-top:10px; display:none;}

  #panel{display:none;}
  .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:10px;}
  .top-row h1{font-size:1.3rem;}
  .save-btn{
    background:var(--accent); color:#fff; border:none; padding:11px 24px; border-radius:24px;
    font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; cursor:pointer; font-size:0.94rem;
  }
  .save-btn:disabled{opacity:0.5; cursor:default;}
  #saveMsg{font-size:0.85rem; margin-top:10px; display:none; padding:10px 14px; border-radius:8px;}
  #saveMsg.ok{display:block; background:var(--accent-tint); color:var(--accent-deep);}
  #saveMsg.no{display:block; background:#EDE0E0; color:#8A3B3B;}

  .cal-tabs{display:flex; gap:10px; margin-bottom:18px;}
  .cal-tab{
    padding:9px 18px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
    font-size:0.9rem; cursor:pointer; font-family:'M PLUS Rounded 1c',sans-serif;
  }
  .cal-tab[aria-selected="true"]{background:var(--accent); color:#fff; border-color:var(--accent);}

  .cal-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px;}
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-nav button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--surface); cursor:pointer;
  }
  .cal-nav h2{font-size:1.05rem;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:0.78rem; color:var(--ink-soft); padding-bottom:6px;}
  .day{
    aspect-ratio:1; border-radius:8px; border:none; font-size:0.88rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .day.empty{visibility:hidden;}
  .day.available{background:var(--accent-tint); color:var(--accent-deep); font-weight:600;}
  .day.booked{background:var(--booked); color:#B9BCC1; text-decoration:line-through;}
  .cal-legend{display:flex; gap:18px; margin-top:16px; font-size:0.82rem; color:var(--ink-soft);}
  .cal-legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .swatch.a{background:var(--accent-tint);}
  .swatch.b{background:var(--booked);}
  .hint{font-size:0.85rem; color:var(--ink-soft); margin-top:16px;}
</style>
</head>
<body>

<div id="gate">
  <h1>後台登入</h1>
  <p>輸入密碼以管理檔期</p>
  <input id="pwInput" type="password" inputmode="numeric" placeholder="密碼" autocomplete="off">
  <button id="pwSubmit">登入</button>
  <p id="gateError">密碼錯誤，請再試一次</p>
</div>

<div id="panel">
  <div class="wrap">
    <div class="top-row">
      <h1>檔期管理</h1>
      <button class="save-btn" id="saveBtn">儲存變更</button>
    </div>
    <div id="saveMsg"></div>

    <div class="cal-tabs" role="tablist">
      <button class="cal-tab" role="tab" aria-selected="true" data-device="s23">Samsung S23 Ultra</button>
      <button class="cal-tab" role="tab" aria-selected="false" data-device="vivo">vivo X300 Ultra</button>
    </div>

    <div class="cal-card">
      <div class="cal-nav">
        <button id="prevMonth" aria-label="上個月">‹</button>
        <h2 id="calMonthLabel"></h2>
        <button id="nextMonth" aria-label="下個月">›</button>
      </div>
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calDays"></div>
      <div class="cal-legend">
        <span><span class="swatch a"></span>可租借（點一下改成已預訂）</span>
        <span><span class="swatch b"></span>已預訂（點一下改回可租借）</span>
      </div>
    </div>
    <p class="hint">點日期只會先在畫面上切換顏色，記得改完要按上方「儲存變更」才會真的更新到網站的檔期確認頁面。</p>
  </div>
</div>

<script>
  const PASSWORD = '1010';
  let bookedDates = { s23: [], vivo: [] };
  let currentDevice = 's23';
  let viewDate = new Date();
  const dowNames = ['日','一','二','三','四','五','六'];

  // ---- login gate ----
  const gate = document.getElementById('gate');
  const panel = document.getElementById('panel');
  const pwInput = document.getElementById('pwInput');
  const gateError = document.getElementById('gateError');

  document.getElementById('pwSubmit').addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });

  function tryLogin(){
    if(pwInput.value === PASSWORD){
      gate.style.display = 'none';
      panel.style.display = 'block';
      loadBookings();
    } else {
      gateError.style.display = 'block';
    }
  }

  // ---- data ----
  async function loadBookings(){
    try {
      const res = await fetch('/.netlify/functions/get-bookings');
      if(res.ok){
        const data = await res.json();
        if(data && data.s23 && data.vivo) bookedDates = data;
      }
    } catch(err){ /* 保持空資料，管理者可以直接從空白開始標記 */ }
    renderCalendar();
  }

  // ---- calendar rendering ----
  const calDow = document.getElementById('calDow');
  const calDays = document.getElementById('calDays');
  const calMonthLabel = document.getElementById('calMonthLabel');

  dowNames.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    calDow.appendChild(el);
  });

  function fmtDate(y,m,d){
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function renderCalendar(){
    const y = viewDate.getFullYear();
    const m = viewDate.getMonth();
    calMonthLabel.textContent = `${y} 年 ${m+1} 月`;
    calDays.innerHTML = '';

    const firstDow = new Date(y,m,1).getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();

    for(let i=0;i<firstDow;i++){
      const empty = document.createElement('div');
      empty.className = 'day empty';
      calDays.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const dateStr = fmtDate(y,m,d);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = d;
      const isBooked = (bookedDates[currentDevice] || []).includes(dateStr);
      btn.className = isBooked ? 'day booked' : 'day available';
      btn.addEventListener('click', () => toggleDate(dateStr));
      calDays.appendChild(btn);
    }
  }

  function toggleDate(dateStr){
    const list = bookedDates[currentDevice] || (bookedDates[currentDevice] = []);
    const idx = list.indexOf(dateStr);
    if(idx === -1) list.push(dateStr); else list.splice(idx,1);
    renderCalendar();
  }

  document.querySelectorAll('.cal-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cal-tab').forEach(t => t.setAttribute('aria-selected','false'));
      tab.setAttribute('aria-selected','true');
      currentDevice = tab.dataset.device;
      renderCalendar();
    });
  });

  document.getElementById('prevMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()-1); renderCalendar(); });
  document.getElementById('nextMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()+1); renderCalendar(); });

  // ---- save ----
  const saveBtn = document.getElementById('saveBtn');
  const saveMsg = document.getElementById('saveMsg');

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveMsg.classList.remove('ok','no');
    saveMsg.style.display = 'none';
    try {
      const res = await fetch('/.netlify/functions/update-bookings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: PASSWORD, bookedDates })
      });
      if(res.ok){
        saveMsg.textContent = '已儲存，網站的檔期確認頁面會顯示最新資料。';
        saveMsg.classList.add('ok');
      } else {
        saveMsg.textContent = '儲存失敗，請確認密碼或稍後再試一次。';
        saveMsg.classList.add('no');
      }
    } catch(err){
      saveMsg.textContent = '儲存失敗，請檢查網路連線。';
      saveMsg.classList.add('no');
    }
    saveMsg.style.display = 'block';
    saveBtn.disabled = false;
  });
</script>

</body>
</html>
